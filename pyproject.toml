[project]
name = "logman"
version = "0.5.3"
description = "Convenience package for logging to multiple sources"
readme = "README.md"
authors = [{ name = "Ben Mongardini", email = "bmongardini@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["log", "logging", "logger"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"logman" = ["default_config.json"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
